<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>찻잎상회 결제</title>
<style>body{font:14px/1.4 sans-serif;margin:0;padding:8px;background:#fff;color:#222}
.opt{display:inline-block;font-size:12px;margin:2px;padding:2px 6px;border:1px solid #bbb}
.b{font-size:12px;height:28px;padding:0 8px;border:1px solid #aaa;background:#eee;margin-right:4px}
input{width:100%;height:28px;margin:2px 0}.err{color:red}</style></head>
<body><h2>결제</h2>
<p>주문 상품: 우전 녹차 50g x2 / 합계 34,000원</p>
<input placeholder="이름"><input placeholder="휴대폰 (숫자만, 하이픈 제외)" id="ph"><input placeholder="주소"><input placeholder="상세 주소">
<p>배송</p><span class="opt">일반</span><span class="opt">당일</span><span class="opt">새벽</span><span class="opt">편의점</span><span class="opt">방문수령</span><span class="opt">해외</span>
<p>결제</p><span class="opt">카드</span><span class="opt">계좌이체</span><span class="opt">가상계좌</span><span class="opt">휴대폰</span><span class="opt">간편A</span><span class="opt">간편B</span><span class="opt">간편C</span><span class="opt">포인트</span>
<p><label><input type="checkbox" style="width:auto"> 선물 포장</label> <label><input type="checkbox" style="width:auto"> 뉴스레터</label> 쿠폰 <input style="width:80px"></p>
<p class="err" id="e"></p>
<button class="b">취소</button><button class="b">임시저장</button><button class="b" onclick="document.getElementById('e').textContent='잘못된 입력'">결제</button>
</body></html>
