<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>집중공부</title>
<!-- theme-source: fallback - own sun/moon switch written for this repo, no third-party toggle code -->
<script>
  /* theme init: runs in <head> so the first paint uses the right theme */
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
:root{--bg:#f6f5f1;--surface:#ffffff;--text:#1d1d1b;--muted:#5a5a55;--line:#d8d6cf;--accent:#2f6b4f;--accent-text:#ffffff;--tint:#e6f0ea;--warn:#8a2f1d;--warn-tint:#fbe9e4;--focus:#2457d6}
:root[data-theme="dark"]{--bg:#121413;--surface:#1b1e1c;--text:#ecece8;--muted:#a8a8a1;--line:#34382f;--accent:#7cc19f;--accent-text:#0e1a13;--tint:#1f2e26;--warn:#ffb4a2;--warn-tint:#3a1f19;--focus:#8fb0ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 "Pretendard","Apple SD Gothic Neo",system-ui,sans-serif}
.ko-text,h1,h2,h3,p,label,button,summary,li{word-break:keep-all;overflow-wrap:anywhere}h1,h2,h3{text-wrap:balance}p{text-wrap:pretty}
button,input,select{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
main{max-width:480px;margin:0 auto;padding:0 16px 48px}.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.btn{display:block;width:100%;min-height:48px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:700}
  /* theme switch */
  .theme-sw{display:grid;place-items:center;width:44px;height:44px;flex:none;border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--text);cursor:pointer}
  .theme-sw svg{grid-area:1/1;width:20px;height:20px}
  .theme-sw .moon{display:none}
  :root[data-theme="dark"] .theme-sw .sun{display:none}
  :root[data-theme="dark"] .theme-sw .moon{display:block}

.hero h1{margin:8px 0}.hero p{margin:4px 0 12px;color:var(--muted)}.sec{margin-top:8px}.sec .btn{margin-top:8px}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 16px;margin:12px 0}details summary{min-height:48px;display:flex;align-items:center;cursor:pointer}
.goal{background:var(--tint);border-radius:10px;padding:10px 12px;margin:8px 0}.timer{font-size:40px;font-variant-numeric:tabular-nums;text-align:center;margin:8px 0}
[hidden]{display:none!important}.sum li{margin:6px 0}
</style></head>
<body>
<div class="top"><strong>집중공부</strong>
<button type="button" class="theme-sw" role="switch" aria-checked="false" aria-label="다크 테마로 전환" title="다크 테마로 전환">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
  </button></div>
<main>
<section id="home">
<div class="card hero"><h1>지난번에 하던 곳에서 이어 합니다</h1>
<p id="resume">수학 · 이차함수 · 7번 문제까지 했습니다. 어제 18:40에 멈췄습니다.</p>
<button class="btn primary" id="go">이어서 10분 하기</button>
<button class="btn sec" id="fresh">새로 시작하기</button></div>
<details><summary>오늘 할 일 더 보기</summary><p>복습 카드 18장 · 수학 40분 목표</p></details>
<details><summary>통계와 설정</summary><p>주간 통계, 학습 설정, 달력은 여기에 모아 두었습니다. 쉬어도 기록은 사라지지 않습니다.</p></details>
</section>
<section id="sess" hidden>
<div class="card"><p class="goal" id="goal">지금 할 일: 이차함수 7번 문제 풀기</p>
<div class="timer" id="t" role="timer" aria-live="off">10:00</div>
<button class="btn primary" id="done">여기까지 하고 마치기</button></div>
</section>
<section id="end" hidden>
<div class="card"><h1>수고했습니다</h1>
<ul class="sum"><li>10분 집중했습니다.</li><li>이차함수 7번까지 풀었습니다.</li><li>다음에는 8번부터 이어 합니다.</li></ul>
<button class="btn primary" id="back">처음으로</button></div>
</section>
</main>
<script>
  (function () {
    var root = document.documentElement, sw = document.querySelector('.theme-sw'), manual = false;
    if (!sw) return;
    try { manual = ['light', 'dark'].indexOf(localStorage.getItem('theme')) >= 0; } catch (e) {}
    function sync() {
      var dark = root.dataset.theme === 'dark', label = dark ? '라이트 테마로 전환' : '다크 테마로 전환';
      sw.setAttribute('aria-checked', String(dark)); sw.setAttribute('aria-label', label); sw.title = label;
    }
    sw.addEventListener('click', function () {
      var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      root.dataset.theme = next; manual = true;
      try { localStorage.setItem('theme', next); } catch (e) {}
      sync();
    });
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
      if (!manual) { root.dataset.theme = e.matches ? 'dark' : 'light'; sync(); }
    });
    sync();
  })();
</script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  let left = 600, tm = 0;
  const fmt = s => String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  const view = id => ['home','sess','end'].forEach(v => $(v).hidden = v!==id);
  function start(){ view('sess'); left=600; $('t').textContent=fmt(left); clearInterval(tm); tm=setInterval(()=>{ left--; $('t').textContent=fmt(left); if(left<=0){ finish(); } },1000); }
  function finish(){ clearInterval(tm); view('end'); }
  $('go').onclick = start; $('fresh').onclick = start; $('done').onclick = finish; $('back').onclick = () => view('home');
})();
</script>
</body></html>
